# Example: one Tesla Wall Connector Gen2 controlled by an ESP32 over RS485.
# The TWC's rotary switch must be on F (slave). Secrets go in secrets.yaml (see secrets.example.yaml).
esphome:
  name: twc
  friendly_name: TWC
  min_version: 2025.7.0

esp32:
  board: esp32-c3-devkitm-1     # any ESP32 works; change the pins below to match your board
  framework:
    type: esp-idf

logger:
  level: DEBUG                  # VERBOSE shows every RS485 frame (TX/RX hex)

api:
  encryption:
    key: !secret twc_api_key

ota:
  - platform: esphome
    password: !secret twc_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret twc_ap_password

captive_portal:

uart:
  id: twc_uart
  tx_pin: 6                     # to RS485 DI
  rx_pin: 7                     # from RS485 RO
  baud_rate: 9600
  rx_buffer_size: 512

external_components:
  - source: github://sigurdi/esphome-twc-controller@main
    components: [twc_controller]

# Optional: power of the circuit the charger is on, from Home Assistant (W).
# Only used on IT 3-phase to tell 1-phase from 3-phase cars that do not report a VIN.
# sensor:
#   - platform: homeassistant
#     id: circuit_power
#     entity_id: sensor.your_circuit_power
#     internal: true

twc_controller:
  uart_id: twc_uart
  flow_control_pin: 8           # RS485 DE/RE
  min_current: 6
  max_current: 16               # main fuse / supply cable (A per phase)
  set_current: 16               # start value of Set Current
  grid_type: TN_3PHASE          # SINGLE_PHASE, TN_3PHASE or IT_3PHASE (see README)

  # Controls
  current_limit:
    name: "Set Current"
  charging:
    name: "Charging Enabled"
  car_type:
    name: "Car Type"            # IT 3-phase only: Auto / 1-phase / 3-phase / 2 sub-chargers

  # Measurements (leave out what you do not need)
  current:
    name: "Charging Current"
  actual_current:
    name: "Actual Current"
  offered_current:
    name: "Offered Current"
  assigned_current:
    name: "Assigned Current"
  max_allowable_current:
    name: "Max Current"
  phase_1_voltage:
    name: "Phase 1 Voltage"
  phase_1_current:
    name: "Phase 1 Current"
  # TN_3PHASE only (the TWC measures L2/L3 there):
  phase_2_voltage:
    name: "Phase 2 Voltage"
  phase_3_voltage:
    name: "Phase 3 Voltage"
  phase_2_current:
    name: "Phase 2 Current"
  phase_3_current:
    name: "Phase 3 Current"
  power:
    name: "Charging Power"
  active_phases:
    name: "Active Phases"
  charge_mode:
    name: "Charge Mode"
  session_energy:
    name: "Session Energy"
  total_energy:
    name: "Total Energy"        # own lifetime counter + offset; use this in the HA Energy dashboard
  energy_offset:
    name: "Total Energy Offset"
    mode: box
  total_kwh_delivered:
    name: "TWC kWh Counter"     # the TWC's own counter (wrong on IT 3-phase, see README)
  state:
    name: "State"
  state_text:
    name: "Status"
  online:
    name: "TWC Online"
  vehicle_charging:
    name: "Vehicle Charging"
  type_check:
    name: "Type Check"          # on while the quick car type check runs
  plug_state:
    name: "Plug"
  car_info:
    name: "Car"
  connected_vin:
    name: "Connected VIN"
  serial:
    name: "Serial"
  firmware_version:
    name: "Firmware Version"
  model:
    name: "TWC Model"

  # Optional shared control (power mode, circuit meter). See twc-dual.yaml for several chargers.
  # multi_charger:
  #   circuit_power: circuit_power
  #   control_mode:
  #     name: "Control Mode"    # Current = Set Current rules, Power = Max Power rules
  #   max_power:
  #     name: "Max Power"
  #   total_power:
  #     name: "Total Power"
